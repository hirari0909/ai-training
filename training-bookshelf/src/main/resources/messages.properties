# 4. 共通メッセージ
# ========================================

# システムメッセージ
common.system.error=システムエラーが発生しました。管理者にお問い合わせください。
common.session.timeout=セッションが切れました。最初からやり直してください。
common.network.error=ネットワークエラーが発生しました。接続を確認してください。

# データベースエラー
db.error.connection=データベースへの接続に失敗しました
db.error.insert=データの登録に失敗しました
db.error.update=データの更新に失敗しました
db.error.delete=データの削除に失敗しました
db.error.select=データの取得に失敗しました
db.error.duplicate=データが重複しています
db.error.constraint=データ整合性エラーが発生しました

# データ不整合エラー
error.notfound.book=指定された書籍が見つかりません
error.notfound.review=指定されたレビューが見つかりません
error.concurrent.update=他のユーザーによって更新されています。最新のデータを取得してください。
error.data.inconsistency=データに不整合があります。管理者にお問い合わせください。

# 操作完了メッセージ
success.register={0}の登録が完了しました
success.update={0}の更新が完了しました
success.delete={0}の削除が完了しました

# 確認メッセージ
