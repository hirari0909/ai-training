# messages.properties
# 書籍管理システム - メッセージリソースファイル
# 文字コード: UTF-8
# 作成日: 2024-12-16

# ========================================
# 1. バリデーションメッセージ
# ========================================

# 必須チェック
validation.required={0}は必須です

# 文字数チェック
validation.length.max={0}は{1}文字以内で入力してください
validation.length.min={0}は{1}文字以上で入力してください
validation.length.range={0}は{1}文字以上{2}文字以内で入力してください

# 日付形式チェック
validation.date.format={0}は正しい日付形式で入力してください
validation.date.future={0}は未来日付を指定できません
validation.date.past={0}は過去日付を指定できません

# 数値チェック
validation.number.format={0}は数値で入力してください
validation.number.min={0}は{1}以上で入力してください
validation.number.max={0}は{1}以下で入力してください
validation.number.range={0}は{1}以上{2}以下で入力してください

# ISBN形式チェック
validation.isbn.format=ISBNは10桁または13桁の数字で入力してください
validation.isbn.checkdigit=ISBNのチェックデジットが正しくありません

# 文字数チェック（BK11レビュー投稿画面用）
validation.maxlength={0}は{1}文字以内で入力してください

# 範囲チェック（BK11レビュー投稿画面用）
validation.range={0}は{1}〜{2}の範囲で入力してください

# 重複チェック
validation.duplicate.isbn=このISBNは既に登録されています

# ========================================
# 2. 画面メッセージ
# ========================================

# 書籍一覧画面（BK01）
bk01.message.nodata=書籍が登録されていません
bk01.message.searchresult={0}件の書籍が見つかりました

# 書籍詳細画面（BK02）
# (表示のみのため、特別なメッセージなし)

# 書籍登録入力画面（BK03）
# (placeholder等は個別画面設計書を参照)

# 書籍登録確認画面（BK04）
bk04.message.confirm=以下の内容で登録します。よろしいですか?

# 書籍登録完了画面（BK05）
bk05.message.success=書籍の登録が完了しました

# 書籍編集入力画面（BK06）
# (BK03と同じplaceholderを使用)

# 書籍編集確認画面（BK07）
bk07.message.confirm=以下の内容で更新します。よろしいですか?

# 書籍編集完了画面（BK08）
bk08.message.success=書籍の更新が完了しました

# 書籍削除確認画面（BK09）
bk09.message.confirm=以下の書籍を削除しますか?
bk09.message.warning=※この操作は取り消せません。関連するレビューも全て削除されます。

# 書籍削除完了画面（BK10）
bk10.message.success=書籍の削除が完了しました

# レビュー投稿入力画面（BK11）
# (placeholder等は個別画面設計書を参照)

# レビュー投稿確認画面（BK12）
bk12.message.confirm=以下の内容でレビューを投稿します。よろしいですか?

# レビュー投稿完了画面（BK13）
bk13.message.success=レビューの投稿が完了しました

