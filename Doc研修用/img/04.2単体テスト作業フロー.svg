<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 55 1100 320" font-family="'Yu Gothic UI', 'Meiryo', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/>
    </marker>
    <linearGradient id="gInput" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#90caf9"/>
    </linearGradient>
    <linearGradient id="gProcess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
    <linearGradient id="gOutput" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Stage labels -->
  <text x="160" y="85" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">① INPUT</text>
  <text x="550" y="85" text-anchor="middle" font-size="18" font-weight="bold" fill="#ef6c00">② PROCESS</text>
  <text x="940" y="85" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32">③ OUTPUT</text>

  <!-- INPUT box -->
  <rect x="40" y="110" width="240" height="250" rx="14" ry="14" fill="url(#gInput)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">設計書 ＆ ソースコード</text>
  <line x1="60" y1="148" x2="260" y2="148" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="60" y="168" font-size="12" font-weight="bold" fill="#0d47a1">📁 Docsシステム/外部設計/</text>
  <text x="75" y="186" font-size="11" fill="#1565c0">・画面設計書 (md)</text>
  <text x="75" y="202" font-size="11" fill="#1565c0">・項目定義書 (md)</text>
  <text x="60" y="226" font-size="12" font-weight="bold" fill="#0d47a1">📁 training-bookshelf/src/main/</text>
  <text x="75" y="244" font-size="11" fill="#1565c0">・Controller / Service</text>
  <text x="75" y="260" font-size="11" fill="#1565c0">・Mapper / Entity / Form</text>
  <text x="60" y="290" font-size="11" font-style="italic" fill="#37474f">※ 設計書を「正」として作成</text>
  <text x="60" y="308" font-size="11" font-style="italic" fill="#37474f">※ 設計書と実装の乖離は</text>
  <text x="60" y="324" font-size="11" font-style="italic" fill="#37474f">　 レポートに記録</text>

  <!-- PROCESS box -->
  <rect x="320" y="110" width="460" height="250" rx="14" ry="14" fill="url(#gProcess)" stroke="#ef6c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">GitHub Copilot（AIエージェント）</text>
  <line x1="340" y1="148" x2="760" y2="148" stroke="#ef6c00" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Prompt inside process -->
  <rect x="395" y="160" width="310" height="46" rx="8" ry="8" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="550" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">📄 単体テスト_Executor.md</text>
  <text x="550" y="198" text-anchor="middle" font-size="11" fill="#5d4037">実行指示プロンプト（下記3ステップ）</text>

  <!-- 3 sub-steps -->
  <rect x="335" y="222" width="135" height="60" rx="6" ry="6" fill="#ffffff" stroke="#ef6c00" stroke-width="1"/>
  <text x="402" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#bf360c">① 仕様書作成</text>
  <text x="402" y="260" text-anchor="middle" font-size="10" fill="#5d4037">クラス×メソッド単位</text>
  <text x="402" y="275" text-anchor="middle" font-size="10" fill="#5d4037">正常/異常/境界/状態遷移</text>

  <rect x="482" y="222" width="135" height="60" rx="6" ry="6" fill="#ffffff" stroke="#ef6c00" stroke-width="1"/>
  <text x="549" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#bf360c">② テストコード作成</text>
  <text x="549" y="260" text-anchor="middle" font-size="10" fill="#5d4037">JUnit 5 + Mockito</text>
  <text x="549" y="275" text-anchor="middle" font-size="10" fill="#5d4037">@WebMvcTest / @Mock</text>

  <rect x="629" y="222" width="135" height="60" rx="6" ry="6" fill="#ffffff" stroke="#ef6c00" stroke-width="1"/>
  <text x="696" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#bf360c">③ テスト実行</text>
  <text x="696" y="260" text-anchor="middle" font-size="10" fill="#5d4037">mvn test</text>
  <text x="696" y="275" text-anchor="middle" font-size="10" fill="#5d4037">mvn jacoco:report</text>

  <!-- arrows between sub-steps -->
  <line x1="470" y1="252" x2="482" y2="252" stroke="#ef6c00" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="617" y1="252" x2="629" y2="252" stroke="#ef6c00" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <text x="550" y="306" text-anchor="middle" font-size="12" fill="#5d4037">入力：「添付に従い単体テストを行ってください」</text>
  <text x="550" y="328" text-anchor="middle" font-size="11" fill="#795548">⏱ 実行時間：約 10〜30 分（クラス数による）</text>

  <!-- OUTPUT box -->
  <rect x="820" y="110" width="240" height="250" rx="14" ry="14" fill="url(#gOutput)" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">生成される資材</text>
  <line x1="840" y1="148" x2="1040" y2="148" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="840" y="168" font-size="12" font-weight="bold" fill="#1b5e20">📁 Docsシステム/単体テスト/</text>
  <text x="855" y="186" font-size="11" fill="#2e7d32">・仕様書/{Class}_UT.md</text>
  <text x="855" y="202" font-size="11" fill="#2e7d32">・テスト結果/{Class}_Report.md</text>
  <text x="855" y="218" font-size="11" fill="#2e7d32">・テスト結果/jacoco/ (HTML)</text>
  <text x="840" y="244" font-size="12" font-weight="bold" fill="#1b5e20">📁 training-bookshelf/src/test/</text>
  <text x="855" y="262" font-size="11" fill="#2e7d32">・{Class}Test.java</text>
  <text x="855" y="278" font-size="11" fill="#2e7d32">　（JUnit5 テストクラス）</text>
  <text x="840" y="308" font-size="11" font-style="italic" fill="#37474f">※ カバレッジ目標</text>
  <text x="840" y="324" font-size="11" font-style="italic" fill="#37474f">　Inst/Line ≧ 95%</text>
  <text x="840" y="340" font-size="11" font-style="italic" fill="#37474f">　Branch ≧ 90%</text>

  <!-- Arrows between top boxes -->
  <line x1="282" y1="220" x2="318" y2="220" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="782" y1="220" x2="818" y2="220" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
