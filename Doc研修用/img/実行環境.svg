<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" font-family="Segoe UI, Meiryo, 'Yu Gothic UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="50" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">▼ 構成イメージ図</text>

  <!-- ============== 受講者/講師 box ============== -->
  <rect x="30" y="180" width="190" height="220" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
  <g transform="translate(125,220)" stroke="#7c3aed" stroke-width="2" fill="#a78bfa">
    <circle cx="0" cy="0" r="14"/>
    <path d="M-22,40 a22,22 0 0 1 44,0 z"/>
  </g>
  <text x="125" y="315" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">受講者 / 講師</text>
  <text x="125" y="345" text-anchor="middle" font-size="13" fill="#475569">PC（ブラウザの</text>
  <text x="125" y="365" text-anchor="middle" font-size="13" fill="#475569">み）</text>

  <!-- HTTPS arrow -->
  <line x1="222" y1="290" x2="295" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="258" y="282" text-anchor="middle" font-size="13" fill="#64748b">HTTPS</text>

  <!-- ============== GitHub Codespaces dashed container ============== -->
  <rect x="300" y="110" width="380" height="360" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <g transform="translate(345,128)">
    <path d="M14,12 a8,8 0 0 1 16,0 a7,7 0 0 1 6,12 H10 a7,7 0 0 1 4,-12 z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2"/>
  </g>
  <text x="385" y="148" font-size="16" font-weight="bold" fill="#334155">GitHub Codespaces（クラウド）</text>

  <!-- ============== VS Code box (contains Copilot Client) ============== -->
  <rect x="325" y="180" width="330" height="270" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <g transform="translate(490,210)" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5">
    <rect x="-22" y="-14" width="44" height="28" rx="3" fill="#dbeafe"/>
    <rect x="-26" y="14" width="52" height="4" rx="2"/>
  </g>
  <text x="490" y="265" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">VS Code</text>
  <text x="490" y="287" text-anchor="middle" font-size="13" fill="#475569">仮想開発環境</text>

  <!-- VS Code badges -->
  <g>
    <rect x="345" y="305" width="100" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="359" cy="318" r="6" fill="#22c55e"/>
    <text x="372" y="322" font-size="12" fill="#1f2937">Spring Boot</text>

    <rect x="455" y="305" width="80" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="464" y="313" width="12" height="12" rx="1.5" fill="#0ea5e9"/>
    <text x="481" y="322" font-size="12" fill="#1f2937">H2 DB</text>

    <rect x="545" y="305" width="95" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
    <path d="M558,319 q4,-12 12,-10 q-2,8 -12,10z" fill="#22c55e"/>
    <text x="575" y="322" font-size="12" fill="#1f2937">Thymeleaf</text>
  </g>

  <!-- GitHub Copilot Client (extension inside VS Code) -->
  <rect x="345" y="350" width="290" height="80" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <g transform="translate(375,390)" stroke="#0f766e" stroke-width="1.5">
    <circle cx="0" cy="-8" r="2.5" fill="#f43f5e" stroke="none"/>
    <line x1="0" y1="-6" x2="0" y2="-2" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="-12" y="-2" width="24" height="20" rx="4" fill="#a7f3d0"/>
    <circle cx="-5" cy="6" r="2" fill="#0f766e" stroke="none"/>
    <circle cx="5" cy="6" r="2" fill="#0f766e" stroke="none"/>
  </g>
  <text x="490" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">GitHub Copilot Client</text>
  <text x="490" y="402" text-anchor="middle" font-size="12" fill="#475569">VS Code 拡張機能</text>
  <text x="490" y="420" text-anchor="middle" font-size="12" fill="#475569">（AIエージェント）</text>

  <!-- API Call arrow (Codespaces -> Copilot cloud, from middle of container) -->
  <line x1="682" y1="290" x2="765" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="723" y="282" text-anchor="middle" font-size="13" fill="#64748b">API Call</text>

  <!-- ============== GitHub Copilot (cloud) box ============== -->
  <rect x="770" y="180" width="240" height="220" rx="14" fill="#dcfce7" stroke="#10b981" stroke-width="2.5"/>
  <!-- cloud icon -->
  <g transform="translate(890,215)" fill="#a7f3d0" stroke="#0f766e" stroke-width="1.8">
    <path d="M-26,8 a14,14 0 0 1 26,-8 a12,12 0 0 1 22,4 a10,10 0 0 1 4,18 H-22 a12,12 0 0 1 -4,-14 z"/>
  </g>
  <text x="890" y="278" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">GitHub Copilot</text>
  <text x="890" y="306" text-anchor="middle" font-size="13" fill="#475569">（クラウド）</text>
  <text x="890" y="335" text-anchor="middle" font-size="13" fill="#475569">AIゲートウェイ</text>
  <text x="890" y="358" text-anchor="middle" font-size="13" fill="#475569">／プロンプト中継</text>

  <!-- Model Call arrow (Copilot -> Claude Sonnet) -->
  <line x1="1012" y1="290" x2="1085" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1048" y="282" text-anchor="middle" font-size="13" fill="#64748b">推論呼出</text>

  <!-- ============== Claude Sonnet 4.6 box ============== -->
  <rect x="1090" y="180" width="240" height="220" rx="14" fill="#fce7f3" stroke="#ec4899" stroke-width="2.5"/>
  <!-- brain icon -->
  <g transform="translate(1210,220)" fill="#f472b6" stroke="#9d174d" stroke-width="1.5">
    <path d="M-18,0 a10,10 0 0 1 8,-14 a10,10 0 0 1 20,0 a10,10 0 0 1 8,14 a10,10 0 0 1 -8,14 a10,10 0 0 1 -20,0 a10,10 0 0 1 -8,-14 z"/>
    <path d="M0,-14 v28 M-10,-7 h20 M-10,7 h20" stroke="#9d174d" fill="none" stroke-width="1.2"/>
  </g>
  <text x="1210" y="280" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Claude Sonnet 4.6</text>
  <text x="1210" y="308" text-anchor="middle" font-size="13" fill="#475569">生成AI（LLM）</text>
  <text x="1210" y="332" text-anchor="middle" font-size="13" fill="#475569">Anthropic</text>
  <text x="1210" y="358" text-anchor="middle" font-size="13" fill="#475569">最終的にコード生成</text>
</svg>
