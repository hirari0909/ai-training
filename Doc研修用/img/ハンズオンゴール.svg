<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" font-family="Segoe UI, Meiryo, 'Yu Gothic UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="700" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">▼ ハンズオンのゴール（1日で仕上げる）</text>

  <!-- ============== 現状 (AS-IS) ============== -->
  <rect x="60" y="90" width="430" height="460" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="275" y="125" text-anchor="middle" font-size="20" font-weight="bold" fill="#92400e">現状（AS-IS）</text>
  <text x="275" y="150" text-anchor="middle" font-size="13" fill="#78350f">設計書だけが存在</text>

  <!-- 外部設計書 -->
  <rect x="100" y="180" width="350" height="80" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <g transform="translate(135,220)" fill="#10b981" stroke="#065f46" stroke-width="1.5">
    <path d="M-12,-16 h18 l8,8 v24 h-26 z" fill="#d1fae5"/>
    <path d="M6,-16 v8 h8" fill="none"/>
    <path d="M-7,-2 h14 M-7,4 h14 M-7,10 h10" stroke="#065f46" fill="none"/>
  </g>
  <text x="290" y="215" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">外部設計書</text>
  <text x="290" y="240" text-anchor="middle" font-size="12" fill="#475569">画面遷移図 / ER図 / TBL定義 / 個別画面設計</text>

  <!-- 簡易詳細設計書 -->
  <rect x="100" y="280" width="350" height="80" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <g transform="translate(135,320)" fill="#10b981" stroke="#065f46" stroke-width="1.5">
    <path d="M-12,-16 h18 l8,8 v24 h-26 z" fill="#d1fae5"/>
    <path d="M6,-16 v8 h8" fill="none"/>
    <path d="M-7,-2 h14 M-7,4 h14 M-7,10 h10" stroke="#065f46" fill="none"/>
  </g>
  <text x="290" y="315" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">簡易な詳細設計書</text>
  <text x="290" y="340" text-anchor="middle" font-size="12" fill="#475569">モジュール一覧 / ネーミングルール</text>

  <!-- 未着手 -->
  <rect x="100" y="385" width="350" height="140" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="275" y="412" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">未着手</text>
  <text x="275" y="442" text-anchor="middle" font-size="14" fill="#991b1b">✗ コーディング (CD)</text>
  <text x="275" y="467" text-anchor="middle" font-size="14" fill="#991b1b">✗ 単体テスト (UT)</text>
  <text x="275" y="492" text-anchor="middle" font-size="14" fill="#991b1b">✗ 機能追加</text>
  <text x="275" y="515" text-anchor="middle" font-size="11" fill="#7f1d1d">（実装・テスト・追加実装はこれから）</text>

  <!-- ============== Arrow (1日で実装) ============== -->
  <polygon points="520,260 830,260 830,225 905,320 830,415 830,380 520,380"
           fill="url(#arrowGrad)" stroke="#334155" stroke-width="2"/>
  <text x="675" y="305" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2937">1日で実装</text>
  <text x="675" y="340" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">AI活用</text>
  <text x="675" y="362" text-anchor="middle" font-size="12" fill="#334155">（Claude Code 等を使って一気通貫）</text>

  <!-- ============== ゴール (TO-BE) ============== -->
  <rect x="920" y="90" width="420" height="460" rx="14" fill="#dcfce7" stroke="#10b981" stroke-width="2.5"/>
  <text x="1130" y="125" text-anchor="middle" font-size="20" font-weight="bold" fill="#166534">ゴール（TO-BE）</text>
  <text x="1130" y="150" text-anchor="middle" font-size="13" fill="#15803d">CD / UT / 機能追加まで完成</text>

  <!-- 既存資産 (継承) -->
  <rect x="950" y="180" width="360" height="55" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="1130" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">✓ 外部設計書 / 簡易な詳細設計書</text>
  <text x="1130" y="225" text-anchor="middle" font-size="11" fill="#475569">（AS-IS から引き継ぎ）</text>

  <!-- コーディング -->
  <rect x="950" y="250" width="360" height="80" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
  <g transform="translate(985,290)" fill="#16a34a" stroke="#14532d" stroke-width="1.5">
    <rect x="-16" y="-12" width="32" height="24" rx="3" fill="#86efac"/>
    <path d="M-8,-2 l-4,4 l4,4 M8,-2 l4,4 l-4,4 M-2,8 l4,-12" stroke="#14532d" fill="none"/>
  </g>
  <text x="1140" y="285" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">✓ コーディング (CD)</text>
  <text x="1140" y="312" text-anchor="middle" font-size="12" fill="#475569">Controller / Service / Mapper の実装</text>

  <!-- 単体テスト -->
  <rect x="950" y="345" width="360" height="80" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
  <g transform="translate(985,385)" fill="#16a34a" stroke="#14532d" stroke-width="1.5">
    <rect x="-14" y="-12" width="28" height="24" rx="3" fill="#86efac"/>
    <path d="M-8,2 l4,4 l8,-10" stroke="#14532d" stroke-width="2.5" fill="none"/>
  </g>
  <text x="1140" y="380" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">✓ 単体テスト (UT)</text>
  <text x="1140" y="407" text-anchor="middle" font-size="12" fill="#475569">Service / Controller / Util の UT 作成</text>

  <!-- 機能追加 -->
  <rect x="950" y="440" width="360" height="80" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
  <g transform="translate(985,480)" fill="#16a34a" stroke="#14532d" stroke-width="1.5">
    <circle cx="0" cy="0" r="13" fill="#86efac"/>
    <path d="M-7,0 h14 M0,-7 v14" stroke="#14532d" stroke-width="2.5" fill="none"/>
  </g>
  <text x="1140" y="475" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">✓ 機能追加</text>
  <text x="1140" y="502" text-anchor="middle" font-size="12" fill="#475569">レビュー投稿機能 等の追加実装</text>

</svg>
