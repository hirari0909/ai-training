<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 55 1100 295" font-family="'Yu Gothic UI', 'Meiryo', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <linearGradient id="gInput" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#90caf9"/>
    </linearGradient>
    <linearGradient id="gProcess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
    <linearGradient id="gOutput" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Stage labels -->
  <text x="160" y="85" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">① INPUT</text>
  <text x="550" y="85" text-anchor="middle" font-size="18" font-weight="bold" fill="#ef6c00">② PROCESS</text>
  <text x="940" y="85" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32">③ OUTPUT</text>

  <!-- INPUT box -->
  <rect x="40" y="110" width="240" height="230" rx="14" ry="14" fill="url(#gInput)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">設計書</text>
  <line x1="60" y1="148" x2="260" y2="148" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="60" y="168" font-size="12" font-weight="bold" fill="#0d47a1">📁 Docsシステム/外部設計/</text>
  <text x="75" y="186" font-size="11" fill="#1565c0">・画面設計書 (md)</text>
  <text x="75" y="202" font-size="11" fill="#1565c0">・項目定義書 (md)</text>
  <text x="75" y="218" font-size="11" fill="#1565c0">・DB設計書 (md)</text>
  <text x="75" y="234" font-size="11" fill="#1565c0">・画面遷移図 (md)</text>
  <text x="60" y="260" font-size="12" font-weight="bold" fill="#0d47a1">📁 Docsシステム/詳細設計/</text>
  <text x="75" y="278" font-size="11" fill="#1565c0">・詳細設計書 (md)</text>
  <text x="60" y="318" font-size="11" font-style="italic" fill="#37474f">※ md のみ読めばOK</text>

  <!-- PROCESS box -->
  <rect x="320" y="110" width="460" height="230" rx="14" ry="14" fill="url(#gProcess)" stroke="#ef6c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">Copilot（AIエージェント）</text>
  <line x1="340" y1="154" x2="760" y2="154" stroke="#ef6c00" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Prompts inside process -->
  <rect x="345" y="170" width="190" height="60" rx="8" ry="8" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="440" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">📄 CD_Executor.md</text>
  <text x="440" y="214" text-anchor="middle" font-size="11" fill="#5d4037">実行指示プロンプト</text>

  <rect x="565" y="170" width="190" height="60" rx="8" ry="8" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="660" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">📄 CD_ルール.md</text>
  <text x="660" y="214" text-anchor="middle" font-size="11" fill="#5d4037">コーディング規約</text>

  <text x="550" y="260" text-anchor="middle" font-size="12" fill="#5d4037">入力：「添付に従いコーディング作業を行ってください」</text>
  <text x="550" y="282" text-anchor="middle" font-size="11" fill="#795548">⏱ 実行時間：約 5〜10 分</text>

  <!-- OUTPUT box -->
  <rect x="820" y="110" width="240" height="230" rx="14" ry="14" fill="url(#gOutput)" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">生成される資材</text>
  <line x1="840" y1="154" x2="1040" y2="154" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="840" y="180" font-size="13" fill="#1b5e20">📁 training-bookshelf/src/</text>
  <text x="855" y="202" font-size="12" fill="#2e7d32">・Controller</text>
  <text x="855" y="222" font-size="12" fill="#2e7d32">・Service</text>
  <text x="855" y="242" font-size="12" fill="#2e7d32">・Mapper</text>
  <text x="855" y="262" font-size="12" fill="#2e7d32">・Entity / Form</text>
  <text x="855" y="282" font-size="12" fill="#2e7d32">・HTML (画面)</text>

  <!-- Arrows between top boxes -->
  <line x1="282" y1="210" x2="318" y2="210" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="782" y1="210" x2="818" y2="210" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
