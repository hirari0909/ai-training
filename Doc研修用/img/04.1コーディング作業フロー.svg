<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="'Yu Gothic UI', 'Meiryo', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <linearGradient id="gInput" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#90caf9"/>
    </linearGradient>
    <linearGradient id="gProcess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
    <linearGradient id="gOutput" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#263238">コーディング作業の流れ</text>
  <text x="550" y="68" text-anchor="middle" font-size="14" fill="#546e7a">研修 4. コーディング作業（10:30–12:30）</text>

  <!-- Stage labels -->
  <text x="160" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">① INPUT</text>
  <text x="550" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#ef6c00">② PROCESS</text>
  <text x="940" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32">③ OUTPUT</text>

  <!-- INPUT box -->
  <rect x="40" y="140" width="240" height="200" rx="14" ry="14" fill="url(#gInput)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">設計書（外部設計）</text>
  <line x1="60" y1="184" x2="260" y2="184" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="60" y="210" font-size="13" fill="#0d47a1">📁 docs/外部設計/</text>
  <text x="75" y="232" font-size="12" fill="#1565c0">・画面設計書 (md)</text>
  <text x="75" y="252" font-size="12" fill="#1565c0">・項目定義書 (md)</text>
  <text x="75" y="272" font-size="12" fill="#1565c0">・DB設計書 (md)</text>
  <text x="75" y="292" font-size="12" fill="#1565c0">・画面遷移図 (md)</text>
  <text x="60" y="320" font-size="11" font-style="italic" fill="#37474f">※ md のみ読めばOK</text>

  <!-- PROCESS box -->
  <rect x="320" y="140" width="460" height="200" rx="14" ry="14" fill="url(#gProcess)" stroke="#ef6c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">Copilot（AIエージェント）</text>
  <line x1="340" y1="184" x2="760" y2="184" stroke="#ef6c00" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Prompts inside process -->
  <rect x="345" y="200" width="190" height="60" rx="8" ry="8" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="440" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">📄 CD_Executor.md</text>
  <text x="440" y="244" text-anchor="middle" font-size="11" fill="#5d4037">実行指示プロンプト</text>

  <rect x="565" y="200" width="190" height="60" rx="8" ry="8" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="660" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">📄 CD_ルール.md</text>
  <text x="660" y="244" text-anchor="middle" font-size="11" fill="#5d4037">コーディング規約</text>

  <text x="550" y="290" text-anchor="middle" font-size="12" fill="#5d4037">入力：「添付に従いコーディング作業を行ってください」</text>
  <text x="550" y="312" text-anchor="middle" font-size="11" fill="#795548">⏱ 実行時間：約 5〜10 分</text>

  <!-- OUTPUT box -->
  <rect x="820" y="140" width="240" height="200" rx="14" ry="14" fill="url(#gOutput)" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">生成される資材</text>
  <line x1="840" y1="184" x2="1040" y2="184" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="840" y="210" font-size="13" fill="#1b5e20">📁 training-bookshelf/src/</text>
  <text x="855" y="232" font-size="12" fill="#2e7d32">・Controller</text>
  <text x="855" y="252" font-size="12" fill="#2e7d32">・Service</text>
  <text x="855" y="272" font-size="12" fill="#2e7d32">・Mapper</text>
  <text x="855" y="292" font-size="12" fill="#2e7d32">・Entity / Form</text>
  <text x="855" y="312" font-size="12" fill="#2e7d32">・HTML (画面)</text>

  <!-- Arrows between top boxes -->
  <line x1="282" y1="240" x2="318" y2="240" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="782" y1="240" x2="818" y2="240" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Down arrow to verification -->
  <line x1="940" y1="345" x2="940" y2="395" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Verification section -->
  <rect x="40" y="400" width="1020" height="180" rx="14" ry="14" fill="#fafafa" stroke="#455a64" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="60" y="430" font-size="17" font-weight="bold" fill="#37474f">④ 資材確認 ＆ 動作確認</text>

  <!-- Code trace -->
  <rect x="60" y="450" width="600" height="110" rx="10" ry="10" fill="#ffffff" stroke="#607d8b" stroke-width="1.5"/>
  <text x="75" y="475" font-size="13" font-weight="bold" fill="#37474f">コードトレース（設計書を見ながら追う）</text>

  <!-- Trace flow chips -->
  <g font-size="11" font-weight="bold">
    <rect x="75" y="495" width="90" height="34" rx="17" ry="17" fill="#e1f5fe" stroke="#0277bd"/>
    <text x="120" y="517" text-anchor="middle" fill="#01579b">Controller</text>
    <line x1="165" y1="512" x2="185" y2="512" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="185" y="495" width="80" height="34" rx="17" ry="17" fill="#e1f5fe" stroke="#0277bd"/>
    <text x="225" y="517" text-anchor="middle" fill="#01579b">Service</text>
    <line x1="265" y1="512" x2="285" y2="512" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="285" y="495" width="80" height="34" rx="17" ry="17" fill="#e1f5fe" stroke="#0277bd"/>
    <text x="325" y="517" text-anchor="middle" fill="#01579b">Mapper</text>
    <line x1="365" y1="512" x2="385" y2="512" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="385" y="495" width="80" height="34" rx="17" ry="17" fill="#e1f5fe" stroke="#0277bd"/>
    <text x="425" y="517" text-anchor="middle" fill="#01579b">Entity</text>
    <line x1="465" y1="512" x2="485" y2="512" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="485" y="495" width="70" height="34" rx="17" ry="17" fill="#e1f5fe" stroke="#0277bd"/>
    <text x="520" y="517" text-anchor="middle" fill="#01579b">HTML</text>
  </g>
  <text x="75" y="552" font-size="11" fill="#546e7a">※ src 配下に正しく格納されているか、設計書と突き合わせて確認</text>

  <!-- Browser & DB check -->
  <rect x="680" y="450" width="370" height="110" rx="10" ry="10" fill="#ffffff" stroke="#607d8b" stroke-width="1.5"/>
  <text x="695" y="475" font-size="13" font-weight="bold" fill="#37474f">動作確認</text>
  <text x="695" y="500" font-size="12" fill="#37474f">🌐 ブラウザ：画面遷移図に従って画面確認</text>
  <text x="695" y="524" font-size="12" fill="#37474f">🗄 H2 Console：DBの中身を確認</text>
  <text x="695" y="548" font-size="11" fill="#546e7a">※ 画面 → DB の流れで正しく動くかチェック</text>

  <!-- Side note: while waiting -->
  <rect x="40" y="610" width="1020" height="80" rx="10" ry="10" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="60" y="638" font-size="14" font-weight="bold" fill="#e65100">💡 待ち時間（5〜10分）に解説するトピック</text>
  <text x="60" y="660" font-size="12" fill="#5d4037">・AIはステートを持たない — ではなぜチャットは成立するのか？</text>
  <text x="60" y="680" font-size="12" fill="#5d4037">・エージェントはなぜ自律的に動けるのか？ — 通常チャットとの違い</text>
</svg>
